<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，小生命</title>
<meta name="description" content="一部讲述婴儿诞生的科普动画短片：孩子听故事，大人看知识卡。">
<style>
  @font-face { font-family: "ZCOOL KuaiLe"; src: url("assets/fonts/ZCOOLKuaiLe-Regular.ttf") format("truetype"); font-display: block; }
  :root { --bg: #0e050a; --fg: #fff4ea; --muted: rgba(255,240,230,.62); --accent: #ffd27a; --panel: rgba(28,10,20,.82); --line: rgba(255,214,180,.22); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; max-width: 100vw; max-height: 100vh; aspect-ratio: 16/9; width: min(100vw, calc(100vh * 16 / 9)); height: auto; }
  body.render canvas { width: 1920px; height: 1080px; max-width: none; max-height: none; }
  /* 开始界面 */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 9vh; gap: 18px; background: linear-gradient(to top, rgba(10,3,8,.85), rgba(10,3,8,0) 55%); transition: opacity .6s; }
  #start.hide { opacity: 0; pointer-events: none; }
  #play-big { font: 400 clamp(22px, 3vw, 34px) "ZCOOL KuaiLe", sans-serif; color: #2a0f1f; background: var(--accent); border: 0; border-radius: 999px; padding: .55em 1.6em; cursor: pointer; box-shadow: 0 0 40px rgba(255,210,122,.45); transition: transform .2s; }
  #play-big:hover { transform: scale(1.05); }
  .modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 15px; color: var(--fg); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; user-select: none; }
  .chip[aria-pressed="true"] { background: rgba(255,210,122,.18); border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 13px; color: var(--muted); text-align: center; }
  /* 控制条 */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 26px 20px 14px; background: linear-gradient(to top, rgba(10,3,8,.9), rgba(10,3,8,0)); display: flex; flex-direction: column; gap: 8px; opacity: 0; transition: opacity .35s; }
  body.ui #bar, #bar:hover { opacity: 1; }
  #track { position: relative; height: 22px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  #track .fill { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--accent); }
  #track .mark { position: absolute; top: 5px; width: 2px; height: 12px; background: rgba(255,240,230,.45); }
  #track .tip { position: absolute; bottom: 24px; transform: translateX(-50%); font-size: 13px; background: var(--panel); border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; display: none; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { background: none; border: 1px solid transparent; color: var(--fg); font-size: 15px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.08); }
  .btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  #time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); margin-right: auto; }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
  @media (max-width: 640px) { .btn { font-size: 13px; padding: 5px 7px; } #bar { padding: 18px 16px 10px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080" aria-label="动画短片《你好，小生命》"></canvas></div>
<div id="start">
  <button id="play-big">▶ 开始观看</button>
  <div class="modes">
    <span class="chip" id="m-subs" role="button" aria-pressed="true">字幕</span>
    <span class="chip" id="m-cards" role="button" aria-pressed="true">给大人的小知识</span>
  </div>
  <div class="hint">约 8 分钟 · 建议打开声音、全屏观看 · 空格暂停，← → 快退快进</div>
</div>
<div id="bar">
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="tip"></div></div>
  <div class="row">
    <button class="btn" id="b-play">⏸ 暂停</button>
    <span id="time">0:00 / 0:00</span>
    <select id="b-chap" aria-label="选择章节"></select>
    <button class="btn" id="b-subs" aria-pressed="true">字幕</button>
    <button class="btn" id="b-cards" aria-pressed="true">知识卡</button>
    <button class="btn" id="b-fs">⛶ 全屏</button>
  </div>
</div>
<audio id="snd" src="assets/soundtrack.m4a" preload="auto"></audio>
<script src="src/timeline.js"></script>
<script src="src/core.js"></script>
<script src="src/art.js"></script>
<script src="src/scenes.js"></script>
<script src="src/scenes2.js"></script>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search);
  const RENDER = q.has('render');
  const opt = { subs: true, cards: true };
  window.ready = document.fonts.load('96px "ZCOOL KuaiLe"', '你好小生命').then(() => document.fonts.ready);
  if (RENDER) {
    document.body.classList.add('render');
    document.getElementById('start').remove(); document.getElementById('bar').remove();
    window.renderAt = T => { renderFrame(ctx, T, opt); return true; };
    window.grab = (T, quality = 0.93) => { renderFrame(ctx, T, opt); return cv.toDataURL('image/jpeg', quality); };
    return;
  }
  const snd = document.getElementById('snd');
  const D = TIMELINE.duration;
  let playing = false, clockT = +(q.get('t') || 0), last = performance.now(), audioOK = true;
  snd.addEventListener('error', () => { audioOK = false; });
  const now = () => (audioOK && snd.readyState >= 2 ? snd.currentTime : clockT);
  function seek(T) { T = clamp(T, 0, D - 0.05); clockT = T; if (audioOK) try { snd.currentTime = T; } catch (e) {} draw(); }
  function play() { playing = true; last = performance.now(); if (audioOK) snd.play().catch(() => { audioOK = false; }); document.getElementById('b-play').textContent = '⏸ 暂停'; }
  function pause() { playing = false; snd.pause(); document.getElementById('b-play').textContent = '▶ 播放'; }
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const fill = document.querySelector('#track .fill'), timeEl = document.getElementById('time'), chap = document.getElementById('b-chap');
  function draw() {
    const T = now();
    renderFrame(ctx, T, opt);
    fill.style.width = (T / D * 100) + '%';
    timeEl.textContent = `${fmt(T)} / ${fmt(D)}`;
    const i = sceneAt(T); if (chap.selectedIndex !== i) chap.selectedIndex = i;
  }
  function loop(ts) {
    if (playing) {
      if (!(audioOK && snd.readyState >= 2)) clockT += (ts - last) / 1000;
      else clockT = snd.currentTime;
      last = ts;
      if (now() >= D - 0.05) pause();
    }
    draw();
    requestAnimationFrame(loop);
  }
  // 章节
  const names = { opening: '序 · 你从哪里来', credits: '片尾' };
  TIMELINE.scenes.forEach(s => {
    const o = document.createElement('option'); o.textContent = names[s.id] || (s.id === 'hello' ? '尾声 · 你好呀' : `${s.num}. ${s.chapter}`); chap.appendChild(o);
    const m = document.createElement('div'); m.className = 'mark'; m.style.left = (s.start / D * 100) + '%'; document.getElementById('track').appendChild(m);
  });
  chap.onchange = () => seek(TIMELINE.scenes[chap.selectedIndex].start + 0.01);
  const track = document.getElementById('track'), tip = track.querySelector('.tip');
  const posT = e => clamp((e.clientX - track.getBoundingClientRect().left) / track.clientWidth) * D;
  track.onclick = e => seek(posT(e));
  track.onmousemove = e => { const T = posT(e); const s = TIMELINE.scenes[sceneAt(T)]; tip.style.display = 'block'; tip.style.left = (T / D * 100) + '%'; tip.textContent = `${fmt(T)} ${s.chapter || names[s.id] || ''}`; };
  track.onmouseleave = () => { tip.style.display = 'none'; };
  const toggle = (key, ...ids) => { opt[key] = !opt[key]; ids.forEach(id => document.getElementById(id).setAttribute('aria-pressed', opt[key])); try { localStorage.setItem('hl-' + key, opt[key]); } catch (e) {} };
  try { ['subs', 'cards'].forEach(k => { if (localStorage.getItem('hl-' + k) === 'false') { opt[k] = false; } }); } catch (e) {}
  ['subs', 'cards'].forEach(k => { document.getElementById('m-' + k).setAttribute('aria-pressed', opt[k]); document.getElementById('b-' + k).setAttribute('aria-pressed', opt[k]); });
  document.getElementById('m-subs').onclick = document.getElementById('b-subs').onclick = () => toggle('subs', 'm-subs', 'b-subs');
  document.getElementById('m-cards').onclick = document.getElementById('b-cards').onclick = () => toggle('cards', 'm-cards', 'b-cards');
  document.getElementById('b-play').onclick = () => playing ? pause() : play();
  document.getElementById('b-fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  let started = false;
  document.getElementById('play-big').onclick = () => { document.getElementById('start').classList.add('hide'); if (!started && !q.has('t')) seek(0); else if (now() > D - 1) seek(0); started = true; play(); };
  cv.onclick = () => { if (document.getElementById('start').classList.contains('hide')) playing ? pause() : play(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!started) { document.getElementById('play-big').click(); return; } playing ? pause() : play(); }
    if (e.code === 'ArrowRight') seek(now() + 5);
    if (e.code === 'ArrowLeft') seek(now() - 5);
  });
  let hideT; addEventListener('mousemove', () => { document.body.classList.add('ui'); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove('ui'), 2200); });
  addEventListener('touchstart', () => { document.body.classList.add('ui'); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove('ui'), 3000); }, { passive: true });
  window.ready.then(() => { if (!q.has('t')) clockT = TIMELINE.scenes[0].cues.title + 3.5; seek(clockT); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
